        <main class="content">
            <div class="page-header">
                <a href="admin-events.html" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Events</a>
                <h1 id="formHeading">Create New Event</h1>
                <p>Fill in the event details below. All fields marked with * are required.</p>
            </div>

            <div class="card" style="max-width:820px;">
                <form id="eventForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="event_name">Event Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="event_name" name="event_name" required placeholder="e.g. AI Innovation Summit">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the event..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="category">Category <span class="required">*</span></label>
                            <select class="form-control" id="category" name="category" required>
                                <option value="">Select category</option>
                                <option value="AI & Technology">AI & Technology</option>
                                <option value="Hackathons">Hackathons</option>
                                <option value="Workshops">Workshops</option>
                                <option value="Career">Career</option>
                                <option value="Cultural">Cultural</option>
                                <option value="Sports">Sports</option>
                                <option value="Seminars">Seminars</option>
                                <option value="Academic">Academic</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="venue">Venue <span class="required">*</span></label>
                            <input type="text" class="form-control" id="venue" name="venue" required placeholder="e.g. Main Auditorium">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="event_date">Date <span class="required">*</span></label>
                            <input type="date" class="form-control" id="event_date" name="event_date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="event_time">Time <span class="required">*</span></label>
                            <input type="time" class="form-control" id="event_time" name="event_time" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="capacity">Capacity <span class="required">*</span></label>
                            <input type="number" class="form-control" id="capacity" name="capacity" required min="1" placeholder="e.g. 100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="image">Image filename</label>
                            <input type="text" class="form-control" id="image" name="image" placeholder="e.g. ai-event.jpg">
                            <div class="form-hint">Must be present in frontend/images/</div>
                        </div>
                    </div>

                    <div style="display:flex;gap:12px;margin-top:24px;">
                        <button type="submit" id="submitBtn" class="btn btn-primary">Create Event</button>
                        <a href="admin-events.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
