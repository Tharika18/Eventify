<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Events — EVENTIFY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="navbar-brand">
                <span class="brand-mark">E</span>
                <span>EVENTIFY</span>
            </a>
            <ul class="navbar-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="user-dashboard.html">Dashboard</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="user-dashboard.html" class="btn btn-ghost">Dashboard</a>
                <a href="my-registrations.html" class="btn btn-primary">My Registrations</a>
            </div>
        </div>
    </header>

    <section class="section" style="padding-top:var(--space-10);">
        <div class="container">
            <div class="page-header">
                <h1>Explore Events</h1>
                <p>Search, filter, and register for events across all categories.</p>
            </div>

            <div class="filters-bar">
                <div class="filters-row">
                    <div class="form-group search-input-wrap" style="margin:0;">
                        <label class="form-label" for="searchInput">Search</label>
                        <span class="search-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search events...">
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label class="form-label" for="categoryFilter">Category</label>
                        <select class="form-control" id="categoryFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label class="form-label" for="dateFilter">Date</label>
                        <select class="form-control" id="dateFilter">
                            <option value="">Any</option>
                            <option value="today">Today</option>
                            <option value="week">Next 7 days</option>
                            <option value="month">Next 30 days</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label class="form-label" for="availabilityFilter">Availability</label>
                        <select class="form-control" id="availabilityFilter">
                            <option value="">Any</option>
                            <option value="available">Seats Available</option>
                            <option value="full">Full</option>
                        </select>
                    </div>

                    <button class="btn btn-secondary" onclick="window.location.reload()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        Reset
                    </button>
                </div>
            </div>

            <div class="events-grid" id="eventsGrid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">© <span data-year>2026</span> EVENTIFY</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="../wasm_build/eventify_core.js"></script>
    <script src="js/wasm-loader.js"></script>
    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Events.prefillFiltersFromURL();
            await Events.initEventsPage();
        });
    </script>
</body>
</html>
